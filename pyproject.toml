[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustops-enterprise-framework"
version = "0.1.0"
description = "Trust-first LLM evaluation, fine-tuning, and comparison framework for AWS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TrustOps Team"}
]
keywords = ["llm", "evaluation", "fine-tuning", "trust-scoring", "aws", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "aiohttp>=3.9.0",
    "numpy>=1.24.0",
    "scipy>=1.11.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "PyYAML>=6.0",
    "streamlit>=1.28.0",
    "plotly>=5.18.0",
    "pandas>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.23.0",
    "hypothesis>=6.92.0",
    "moto>=4.2.0",
    "black>=23.0.0",
    "pylint>=3.0.0",
]

[project.scripts]
trustops = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["src*", "cli*", "dashboard*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
]

[tool.black]
line-length = 100
target-version = ["py311"]
