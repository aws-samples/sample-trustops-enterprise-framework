[build-system]
requires = ["setuptools==68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trustops-enterprise-framework"
version = "0.1.0"
description = "Trust-first LLM evaluation, fine-tuning, and comparison framework for AWS"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "TrustOps Team"}
]
keywords = ["llm", "evaluation", "fine-tuning", "trust-scoring", "aws", "bedrock"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "boto3==1.43.100",
    "botocore==1.43.100",
    "aiohttp==3.14.3",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "click==8.5.0",
    "PyYAML==6.0.3",
    "streamlit==1.64.0",
    "plotly==7.1.0",
    "pandas==3.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "hypothesis==6.168.1",
    "moto==5.2.3",
    "black==26.10.1",
    "pylint==3.0.0",
]

[project.scripts]
trustops = "cli.main:cli"

[tool.setuptools.packages.find]
include = ["src*", "cli*", "dashboard*", "config*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers --tb=short --disable-warnings"
markers = [
    "unit: Unit tests",
    "property: Property-based tests",
    "integration: Integration tests",
    "slow: Tests that take significant time to run",
    "requires_aws: Tests that require AWS credentials and services",
]

[tool.black]
line-length = 100
target-version = ["py311"]
