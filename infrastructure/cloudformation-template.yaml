  # Step Functions State Machines
  BaselineEvaluationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-baseline-evaluation-${Environment}-${DeploymentId}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "Baseline Evaluation Workflow",
          "StartAt": "RunEvaluation",
          "States": {
            "RunEvaluation": {
              "Type": "Task",
              "Resource": "${EvaluationOrchestratorFunction.Arn}",
              "Parameters": {
                "evaluation_type": "baseline",
                "model_id.$": "$.model_id",
                "dataset_id.$": "$.dataset_id",
                "inference_params.$": "$.inference_params"
              },
              "ResultPath": "$.evaluation_result",
              "Next": "ScoreTrust"
            },
            "ScoreTrust": {
              "Type": "Task",
              "Resource": "${TrustScoringFunction.Arn}",
              "Parameters": {
                "response.$": "$.evaluation_result.body",
                "prompt.$": "$.model_id"
              },
              "ResultPath": "$.trust_result",
              "End": true
            }
          }
        }
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt EvaluationLogGroup.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  FineTuningStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-fine-tuning-${Environment}-${DeploymentId}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "Fine-Tuning Workflow",
          "StartAt": "InitializeRetryCounter",
          "TimeoutSeconds": 86400,
          "States": {
            "InitializeRetryCounter": {
              "Type": "Pass",
              "Result": 0,
              "ResultPath": "$.poll_count",
              "Next": "StartFineTuning"
            },
            "StartFineTuning": {
              "Type": "Task",
              "Resource": "${FineTuningOrchestratorFunction.Arn}",
              "Parameters": {
                "action": "start",
                "base_model_id.$": "$.base_model_id",
                "training_data_id.$": "$.training_data_id",
                "hyperparameters.$": "$.hyperparameters"
              },
              "ResultPath": "$.job_result",
              "Next": "WaitForTraining",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ]
            },
            "WaitForTraining": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "IncrementCounter"
            },
            "IncrementCounter": {
              "Type": "Pass",
              "Parameters": {
                "poll_count.$": "States.MathAdd($.poll_count, 1)"
              },
              "ResultPath": "$.counter",
              "Next": "CheckMaxPolls"
            },
            "CheckMaxPolls": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.counter.poll_count",
                  "NumericGreaterThan": 720,
                  "Next": "TrainingTimedOut"
                }
              ],
              "Default": "CheckStatus"
            },
            "CheckStatus": {
              "Type": "Task",
              "Resource": "${FineTuningOrchestratorFunction.Arn}",
              "Parameters": {
                "action": "status",
                "job_id.$": "$.job_result.body"
              },
              "ResultPath": "$.status_result",
              "Next": "IsComplete",
              "Retry": [
                {
                  "ErrorEquals": ["Lambda.ServiceException", "Lambda.AWSLambdaException", "Lambda.SdkClientException"],
                  "IntervalSeconds": 2,
                  "MaxAttempts": 3,
                  "BackoffRate": 2
                }
              ]
            },
            "IsComplete": {
              "Type": "Choice",
              "Choices": [
                {
                  "Variable": "$.status_result.statusCode",
                  "NumericEquals": 200,
                  "Next": "TrainingDone"
                }
              ],
              "Default": "WaitForTraining"
            },
            "TrainingDone": {
              "Type": "Succeed"
            },
            "TrainingTimedOut": {
              "Type": "Fail",
              "Cause": "Fine-tuning job exceeded maximum polling duration (12 hours)",
              "Error": "TrainingTimeoutError"
            }
          }
        }
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt FineTuningLogGroup.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  ComparativeEvaluationStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: !Sub '${ProjectName}-comparative-evaluation-${Environment}-${DeploymentId}'
      RoleArn: !GetAtt StepFunctionsExecutionRole.Arn
      TracingConfiguration:
        Enabled: true
      DefinitionString: !Sub |
        {
          "Comment": "Comparative Evaluation Workflow",
          "StartAt": "RunComparison",
          "States": {
            "RunComparison": {
              "Type": "Task",
              "Resource": "${ComparativeEvaluationFunction.Arn}",
              "Parameters": {
                "model_id_1.$": "$.model_id_1",
                "model_id_2.$": "$.model_id_2",
                "dataset_id.$": "$.dataset_id",
                "inference_params.$": "$.inference_params"
              },
              "ResultPath": "$.comparison_result",
              "Next": "ScoreResults"
            },
            "ScoreResults": {
              "Type": "Task",
              "Resource": "${TrustScoringFunction.Arn}",
              "Parameters": {
                "response.$": "$.comparison_result.body",
                "prompt.$": "$.model_id_1"
              },
              "ResultPath": "$.trust_result",
              "End": true
            }
          }
        }
      LoggingConfiguration:
        Level: ALL
        IncludeExecutionData: true
        Destinations:
          - CloudWatchLogsLogGroup:
              LogGroupArn: !GetAtt EvaluationLogGroup.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
        - Key: Environment
          Value: !Ref Environment

  # CloudWatch Alarms
  HighErrorRateAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-high-error-rate-${Environment}-${DeploymentId}'
      AlarmDescription: Alert when error rate exceeds 5%
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'
      OKActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'

  LambdaTimeoutAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-lambda-timeout-${Environment}-${DeploymentId}'
      AlarmDescription: Alert when Lambda timeout rate exceeds 10%
      MetricName: Duration
      Namespace: AWS/Lambda
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 850000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'

  WorkflowFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-workflow-failure-${Environment}-${DeploymentId}'
      AlarmDescription: Alert when workflow failure rate exceeds 20%
      MetricName: ExecutionsFailed
      Namespace: AWS/States
      Statistic: Sum
      Period: 3600
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'

  TrustScoreDegradationAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-trust-score-degradation-${Environment}-${DeploymentId}'
      AlarmDescription: Alert when mean trust score drops more than 10%
      MetricName: TrustScore
      Namespace: TrustOps
      Statistic: Average
      Period: 3600
      EvaluationPeriods: 2
      Threshold: 0.6
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'

  DlqMessagesAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ProjectName}-dlq-messages-${Environment}-${DeploymentId}'
      AlarmDescription: Alert when messages land in the dead letter queue
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      Dimensions:
        - Name: QueueName
          Value: !GetAtt LambdaDeadLetterQueue.QueueName
      AlarmActions: !If
        - HasAlertEmail
        - [!Ref AlarmNotificationTopic]
        - !Ref 'AWS::NoValue'

